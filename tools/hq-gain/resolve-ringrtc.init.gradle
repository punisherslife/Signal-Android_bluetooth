/*
 * Resolve the exact RingRTC AAR selected by Signal's githubProdRelease runtime.
 *
 * Gradle applies init scripts to the main build AND included builds such as
 * build-logic. Included builds do not contain Signal's app project, so they must
 * be ignored rather than treated as an error.
 */
gradle.projectsEvaluated {
  def root = gradle.rootProject
  def expectedAppDir = new File(root.rootDir, "app")

  // This callback also runs for included builds (for example build-logic).
  // Only the main Signal build has app/build.gradle.kts.
  if (!new File(expectedAppDir, "build.gradle.kts").isFile()) {
    return
  }

  def canonicalAppDir = expectedAppDir.canonicalFile
  def app = root.allprojects.find { project ->
    project.projectDir.canonicalFile == canonicalAppDir
  }

  if (app == null) {
    throw new GradleException("Could not locate Signal app project at ${canonicalAppDir}")
  }

  app.tasks.register("copyHqGainRingRtc") {
    doLast {
      def configuration = app.configurations.findByName("githubProdReleaseRuntimeClasspath")
      if (configuration == null) {
        throw new GradleException("Could not find githubProdReleaseRuntimeClasspath on ${app.path}")
      }

      def artifact = configuration.resolvedConfiguration.resolvedArtifacts.find {
        it.moduleVersion.id.group == "org.signal" && it.name == "ringrtc-android"
      }
      if (artifact == null) {
        throw new GradleException("Resolved runtime classpath did not contain org.signal:ringrtc-android")
      }

      def ringRtcComponent = configuration.incoming.resolutionResult.allComponents.find { component ->
        def id = component.moduleVersion
        id != null && id.group == "org.signal" && id.name == "ringrtc-android"
      }
      if (ringRtcComponent == null) {
        throw new GradleException("Could not find RingRTC component in resolution result")
      }

      def directDependencies = ringRtcComponent.dependencies.findAll { dependency ->
        dependency instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult
      }.collect { dependency ->
        dependency.selected.moduleVersion
      }.findAll { id ->
        id != null
      }.collect { id ->
        "${id.group}:${id.name}:${id.version}"
      }.unique().sort()

      def outputDir = new File(app.buildDir, "hq-gain")
      outputDir.mkdirs()
      def output = new File(outputDir, "ringrtc-original.aar")
      output.bytes = artifact.file.bytes
      new File(outputDir, "ringrtc-version.txt").text = artifact.moduleVersion.id.version + "\n"
      new File(outputDir, "ringrtc-direct-dependencies.txt").text = directDependencies.join("\n") + (directDependencies.isEmpty() ? "" : "\n")
      println("HQ_GAIN_APP_PROJECT=" + app.path)
      println("HQ_GAIN_RINGRTC=" + artifact.moduleVersion.id)
      println("HQ_GAIN_AAR=" + output.absolutePath)
      println("HQ_GAIN_DIRECT_DEPS=" + directDependencies.join(","))
    }
  }
}
