name: Build patched Signal release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional Signal tag (example: v8.25.2). Leave blank for latest stable."
        required: false
        type: string
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: signal-audio-fork-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.upstream.outputs.tag }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          lfs: true

      - name: Preserve patch scripts
        run: |
          rm -rf /tmp/signal-audio-fork-kit
          mkdir -p /tmp/signal-audio-fork-kit
          cp -a patches /tmp/signal-audio-fork-kit/

      - name: Resolve upstream Signal release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED='${{ inputs.upstream_tag }}'
          if [[ -n "$REQUESTED" ]]; then
            TAG="$REQUESTED"
          else
            TAG="$(gh api repos/signalapp/Signal-Android/releases/latest --jq '.tag_name')"
          fi
          RELEASE_TAG="fork-${TAG}-audio.16"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Signal upstream: $TAG"

      - name: Check whether this upstream release is already published
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if gh release view '${{ steps.upstream.outputs.release_tag }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch exact Signal tag
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/signalapp/Signal-Android.git
          git fetch --force upstream "refs/tags/${{ steps.upstream.outputs.tag }}:refs/tags/${{ steps.upstream.outputs.tag }}"
          git checkout --detach "${{ steps.upstream.outputs.tag }}"
          git submodule sync --recursive
          git submodule update --init --recursive
          git lfs pull

      - name: Apply all call/audio patches
        if: steps.existing.outputs.exists == 'false'
        id: patches
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/signal-audio-fork-kit/patches/0001-hq-bluetooth.py "$GITHUB_WORKSPACE"
          python /tmp/signal-audio-fork-kit/patches/0002-proximity-toggle.py "$GITHUB_WORKSPACE"
          python /tmp/signal-audio-fork-kit/patches/0003-video-phone-speaker.py "$GITHUB_WORKSPACE"


      - name: Verify patch diff
        if: steps.existing.outputs.exists == 'false' && steps.patches.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Set up Java 21
        if: steps.existing.outputs.exists == 'false' && steps.patches.outcome == 'success'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper
        if: steps.existing.outputs.exists == 'false' && steps.patches.outcome == 'success'
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up Gradle
        if: steps.existing.outputs.exists == 'false' && steps.patches.outcome == 'success'
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up Android SDK command-line tools
        if: steps.existing.outputs.exists == 'false' && steps.patches.outcome == 'success'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Signal's requested Android SDK/NDK/build-tools
        if: steps.existing.outputs.exists == 'false' && steps.patches.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import tomllib
          with open('gradle/libs.versions.toml', 'rb') as f:
              v = tomllib.load(f)['versions']
          print('NDK_VERSION=' + repr(v['ndk']))
          print('BUILD_TOOLS_VERSION=' + repr(v['buildTools']))
          print('COMPILE_SDK=' + repr(v['compileSdk']))
          PY
          )"

          echo "sdkmanager: $(command -v sdkmanager)"
          echo "Signal requests compileSdk=$COMPILE_SDK, build-tools=$BUILD_TOOLS_VERSION, NDK=$NDK_VERSION"

          # API 37+ preview/minor SDKs can be published as e.g.
          # platforms;android-37.0 instead of platforms;android-37.
          # Parse the package-name column EXACTLY; do not substring-match it.
          SDK_LIST="$(mktemp)"
          sdkmanager --list --channel=3 --include_obsolete > "$SDK_LIST"

          mapfile -t PLATFORM_CANDIDATES < <(
            awk -F '|' -v api="$COMPILE_SDK" '
              {
                pkg=$1
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", pkg)
                if (pkg == "platforms;android-" api || pkg ~ ("^platforms;android-" api "\\.[0-9]+$")) {
                  print pkg
                }
              }
            ' "$SDK_LIST" | sort -V -u
          )

          PLATFORM_PACKAGE=""

          # Prefer the traditional exact package if it truly exists.
          for candidate in "${PLATFORM_CANDIDATES[@]}"; do
            if [[ "$candidate" == "platforms;android-$COMPILE_SDK" ]]; then
              PLATFORM_PACKAGE="$candidate"
              break
            fi
          done

          # Otherwise prefer the .0 package used by Android 17 / API 37.
          if [[ -z "$PLATFORM_PACKAGE" ]]; then
            for candidate in "${PLATFORM_CANDIDATES[@]}"; do
              if [[ "$candidate" == "platforms;android-$COMPILE_SDK.0" ]]; then
                PLATFORM_PACKAGE="$candidate"
                break
              fi
            done
          fi

          # Future-proof fallback: use the lowest matching minor package.
          if [[ -z "$PLATFORM_PACKAGE" && ${#PLATFORM_CANDIDATES[@]} -gt 0 ]]; then
            PLATFORM_PACKAGE="${PLATFORM_CANDIDATES[0]}"
          fi

          if [[ -z "$PLATFORM_PACKAGE" ]]; then
            echo "Could not find an installable SDK platform for compileSdk $COMPILE_SDK." >&2
            echo "SDK manager entries mentioning API $COMPILE_SDK:" >&2
            grep -E "platforms;android-${COMPILE_SDK}([.]?[0-9]*)?[[:space:]]*\\|" "$SDK_LIST" || true
            exit 1
          fi

          echo "Installable candidates: ${PLATFORM_CANDIDATES[*]}"
          echo "Using Android platform package: $PLATFORM_PACKAGE"

          sdkmanager --channel=3 \
            "$PLATFORM_PACKAGE" \
            "build-tools;$BUILD_TOOLS_VERSION" \
            "ndk;$NDK_VERSION"

          # Show what actually landed on disk; useful if a future preview SDK
          # changes naming again.
          echo "Installed platform directories:"
          ls -1 "$ANDROID_SDK_ROOT/platforms" || true

      - name: Run Signal's normal PR-level CI
        if: steps.existing.outputs.exists == 'false' && steps.patches.outcome == 'success'
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew ciRemote


      - name: Prepare persistent fork signing key
        if: steps.existing.outputs.exists == 'false' && steps.patches.outcome == 'success'
        id: signing_key
        shell: bash
        env:
          FORK_KEYSTORE_B64: ${{ secrets.FORK_KEYSTORE_B64 }}
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          FORK_KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
          FORK_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FORK_KEYSTORE_B64:?Missing FORK_KEYSTORE_B64 repository secret}"
          : "${FORK_KEYSTORE_PASSWORD:?Missing FORK_KEYSTORE_PASSWORD repository secret}"
          : "${FORK_KEY_ALIAS:?Missing FORK_KEY_ALIAS repository secret}"

          printf '%s' "$FORK_KEYSTORE_B64" | base64 --decode > fork-signing.jks

          KEYSTORE_INFO="$(keytool -list \
            -keystore fork-signing.jks \
            -storepass "$FORK_KEYSTORE_PASSWORD" \
            -alias "$FORK_KEY_ALIAS")"

          KEYSTORE_TYPE="$(keytool -list \
            -keystore fork-signing.jks \
            -storepass "$FORK_KEYSTORE_PASSWORD" | \
            awk -F': ' '/^Keystore type:/ { print $2; exit }')"

          if [[ -z "$KEYSTORE_TYPE" ]]; then
            echo "Could not determine keystore type." >&2
            exit 1
          fi

          if [[ "$KEYSTORE_TYPE" != "PKCS12" ]]; then
            : "${FORK_KEY_PASSWORD:?Missing FORK_KEY_PASSWORD repository secret for non-PKCS12 keystore}"
          fi

          echo "type=$KEYSTORE_TYPE" >> "$GITHUB_OUTPUT"
          echo "Signing keystore validated; type=$KEYSTORE_TYPE, alias exists."

      - name: Build optimized githubProdRelease APK
        if: steps.existing.outputs.exists == 'false' && steps.patches.outcome == 'success'
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :Signal-Android:assembleGithubProdRelease --stacktrace


      - name: Sign release APK and create checksum
        if: steps.existing.outputs.exists == 'false'
        id: artifact
        shell: bash
        env:
          FORK_KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          FORK_KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
          FORK_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BUILD_TOOLS_VERSION="$(python - <<'PY'
          import tomllib
          with open('gradle/libs.versions.toml', 'rb') as f:
              print(tomllib.load(f)['versions']['buildTools'])
          PY
          )"

          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          mkdir -p dist

          # Signal enables ABI splits plus a universal APK. Prefer the universal
          # artifact explicitly; fall back to the largest APK if naming changes.
          APK="$(find app/build/outputs/apk -type f -name '*universal*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            APK="$(find app/build/outputs/apk -type f -name '*.apk' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          fi
          if [[ -z "$APK" ]]; then
            echo "No release APK found" >&2
            exit 1
          fi

          echo "Signing APK: $APK"

          # PKCS12 (the format used by the signing bundle I generated for this kit)
          # does not support an independent private-key password in Java's PKCS12
          # implementation. In that case the effective key password is storepass.
          if [[ "${{ steps.signing_key.outputs.type }}" == "PKCS12" ]]; then
            export EFFECTIVE_KEY_PASSWORD="$FORK_KEYSTORE_PASSWORD"
          else
            : "${FORK_KEY_PASSWORD:?Missing FORK_KEY_PASSWORD}"
            export EFFECTIVE_KEY_PASSWORD="$FORK_KEY_PASSWORD"
          fi

          ALIGNED="dist/aligned-unsigned.apk"
          OUT="dist/Signal-${{ steps.upstream.outputs.tag }}-audiofork-release.apk"

          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks fork-signing.jks \
            --ks-key-alias "$FORK_KEY_ALIAS" \
            --ks-pass env:FORK_KEYSTORE_PASSWORD \
            --key-pass env:EFFECTIVE_KEY_PASSWORD \
            --out "$OUT" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$OUT"
          rm -f "$ALIGNED"

          sha256sum "$OUT" > "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "checksum=$OUT.sha256" >> "$GITHUB_OUTPUT"
          ls -lh dist/


      - name: Commit patched source
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          rm -f fork-signing.jks
          git config user.name "signal-audio-fork-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Apply call audio patches to ${{ steps.upstream.outputs.tag }}"

      - name: Push patched source branches and tag
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ steps.upstream.outputs.tag }}'
          RELEASE_TAG='${{ steps.upstream.outputs.release_tag }}'
          git push --force origin HEAD:refs/heads/patched-stable
          git push --force origin HEAD:refs/heads/generated/$TAG-audio
          git tag -f "$RELEASE_TAG"
          git push --force origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          gh release create '${{ steps.upstream.outputs.release_tag }}' \
            --repo "$GITHUB_REPOSITORY" \
            '${{ steps.artifact.outputs.apk }}' \
            '${{ steps.artifact.outputs.checksum }}' \
            --title "Signal ${{ steps.upstream.outputs.tag }} + call audio patches" \
            --notes $'Optimized githubProdRelease fork build based on the corresponding stable Signal Android release.\n\nChanges:\n- Per-call High quality Bluetooth audio toggle for classic Bluetooth (experimental; uses non-SCO media routing)\n- Per-call proximity sensor toggle\n- Phone/earpiece vs speaker selection remains available during video calls\n- Temporary overrides reset on audio-route changes and are not persisted\n\nThe APK is signed with this fork repository\'s persistent signing key, not Signal Messenger LLC\'s key.'

      - name: Archive reports for failed build
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reports-${{ github.run_id }}
          path: |
            **/build/reports
            **/build/test-results
          if-no-files-found: ignore

      - name: Write failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Patched Signal build failed"
            echo
            echo "The workflow stopped on the real failing step."
            echo "No GitHub Release was published by this run."
            echo
            echo "Inspect the first red step above for the actual patch / CI / compile / signing error."
          } >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    name: Report failed patched build
    needs: build
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Open or update failure issue
        shell: bash
        run: |
          set -euo pipefail

          TAG='${{ needs.build.outputs.upstream_tag }}'
          if [[ -z "$TAG" ]]; then
            TAG="unknown-upstream"
          fi

          TITLE="Patched Signal build failed for $TAG"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf -v BODY '%s\n\nUpstream: `%s`\nWorkflow run: %s\nCommit: `%s`\n\n%s\n\n%s' \
            "The automatic patched Signal build failed." \
            "$TAG" \
            "$RUN_URL" \
            "$GITHUB_SHA" \
            "The original failing build step remains red in Actions; this issue is only a notification and does not replace the real error log." \
            "If this is a scheduled run, no APK/release was published from the failed run."

          ISSUE_NUMBER="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "$TITLE in:title" \
              --json number,title \
              --jq ".[] | select(.title == \"$TITLE\") | .number" \
              | head -n1
          )"

          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$BODY"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "$BODY"
          fi

